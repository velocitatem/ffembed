[project]
name = "ffembed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Rosel", email = "daniel@alves.world" }
]
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.4",
    "watchdog>=4.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
image = [
    "transformers>=4.56",
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=10.0",
]

[project.scripts]
ffembed = "ffembed.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "openai>=1.40",
    "bm25s>=0.3.11",
    "pytrec-eval-terrier>=0.5.10",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"
